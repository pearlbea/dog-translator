<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dog Translator</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <main>
      <h1>🐶 Dog Translator</h1>
      <p class="sub">For entertainment purposes only. Your dog has never said any of this.</p>
      <button id="start">Start listening</button>
      <div id="status">Idle</div>
      <div class="meter"><div id="level"></div></div>
      <div id="indicator">Waiting for a dog…</div>
      <label class="slider">
        Sensitivity
        <input id="sens" type="range" min="0.1" max="0.9" step="0.05" value="0.6" />
        <span id="sensVal">0.40</span>
      </label>
      <div id="bubble" hidden></div>
      <h2>History</h2>
      <ul id="history"></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
